[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggal-desk"
version = "0.1.0"
description = "Read-only GGAL futures price comparisons and manual position scenarios"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ppi-readonly = "market_making.ppi.cli:main"

[project.gui-scripts]
ggal-desk = "market_making.desktop.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", "build", "dist", ".venv", ".venv-desktop-build"]
